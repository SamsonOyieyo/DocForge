# Builds DocForge on every push to main and publishes downloadable binaries.
#
# Targets:
#   * Android APK + AAB (runs on a hosted Ubuntu runner, no secrets required)
#   * Windows x64 desktop (primary platform; the VS C++ toolchain is preinstalled)
#
# Web is intentionally absent: DocForge uses dart:io for engine processes.
# iOS is absent until signing is configured and mobile engines are bundled;
# it would need a macos runner plus certificates/provisioning profiles.
name: Build DocForge

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: this workflow only builds and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch cancels the previous run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the local SDK (Flutter 3.41.5 / Dart 3.11.3).
  FLUTTER_VERSION: 3.41.5
  FLUTTER_CHANNEL: stable

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version from pubspec
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | cut -d+ -f1)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # Android deliberately ships NO downloadable native engines: API 29+
      # refuses execve() on files in the app home directory, so QPDF/Poppler
      # must be APK-native (FFI/jniLibs) while only scripts/data can be
      # hot-swapped. See docs/ENGINES_OTA.md before adding a seed here.
      - name: Build release APKs (one per ABI)
        run: flutter build apk --release --split-per-abi --build-number "${{ github.run_number }}"

      - name: Build release app bundle
        run: flutter build appbundle --release --build-number "${{ github.run_number }}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')
            cp "$apk" "dist/DocForge-${APP_VERSION}-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/DocForge-${APP_VERSION}.aab"

      # archive: false uploads the file as-is, so the artifact is the APK/AAB
      # itself rather than a zip wrapping it. One step per ABI keeps a single
      # file per artifact (the action requires that when archive is false).
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.aab
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Desktop builds can bundle engine seeds (OTA then updates them). The
      # manifest and packages come from the rolling `engines` release, so this
      # step is skipped gracefully until the first engine release exists.
      - name: Stage bundled engine seeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/engines/engines_manifest.json"
          if ! curl -fsSL "$manifest_url" -o "$RUNNER_TEMP/engines_manifest.json"; then
            echo "::warning::No engine release yet; building with an empty seed manifest."
            exit 0
          fi
          mkdir -p assets/engines
          # Only the desktop packages this build actually seeds; the release
          # also carries macOS/Linux/Android packaging artifacts.
          gh release download engines \
            --pattern 'qpdf-*-windows-x64.zip' \
            --pattern 'scaffold-*-windows-x64.zip' \
            --dir assets/engines \
            --clobber || true
          python tool/engines/manifest.py seeds \
            --manifest "$RUNNER_TEMP/engines_manifest.json" \
            --assets-dir assets/engines \
            --output assets/engines/seeds.json \
            --engines qpdf,scaffold \
            --platforms windows-x64 \
            --allow-missing || echo "::warning::Engine seeds could not be staged; the app will detect system installs only."

      - name: Read app version from pubspec
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value.Trim().Split('+')[0]
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release app
        run: flutter build windows --release

      # Engines (QPDF, Tesseract, ...) are resolved at runtime from the host or a
      # portable `engines/` folder next to DocForge.exe. Hosted runners have none
      # installed, so this artifact ships without them. For a portable build,
      # stage engines locally before packaging:
      #   pwsh -File tool/stage_engines.ps1 -Destination build/windows/x64/runner/Release/engines
      # See docs/ENGINES.md.
      - name: Package build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/DocForge-$env:APP_VERSION-windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
